<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — UserAuth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">

    <!-- Brand Header -->
    <div class="brand">
        <div class="brand-icon">
            <!-- Key icon -->
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12.65 10A6 6 0 1 0 14 12.65L21 20l-1.5 1.5L18 20l-1.5 1.5L15 20l-1.5 1.5-2-2 2-2-2.85-2.85zM8 14A4 4 0 1 1 8 6a4 4 0 0 1 0 8z"/>
            </svg>
        </div>
        <h1>Reset Password</h1>
        <p>Enter your account details to reset</p>
    </div>

    <!-- Alert Messages -->
    <div id="alertBox"></div>

    <!-- Forgot Password Form -->
    <!-- The identifier field accepts username OR email OR mobile -->
    <form action="ForgotPasswordServlet" method="post" onsubmit="return validateForm()">

        <!-- Identifier -->
        <div class="form-group">
            <label for="identifier">Username / Email / Mobile</label>
            <input type="text" id="identifier" name="identifier"
                   placeholder="Enter any one of these" required>
        </div>

        <!-- New Password -->
        <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" name="newPassword"
                   placeholder="Minimum 6 characters" required minlength="6">
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
            <label for="confirmPassword">Confirm New Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword"
                   placeholder="Re-enter new password" required minlength="6">
        </div>

        <!-- Submit -->
        <button type="submit" class="btn">Update Password</button>

    </form>

    <hr class="divider">

    <div class="form-footer">
        Remembered it? <a href="login.html">Back to Login</a>
    </div>

</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const alertBox = document.getElementById('alertBox');

    if (params.get('error')) {
        alertBox.innerHTML = `<div class="alert alert-error">⚠️ ${decodeURIComponent(params.get('error'))}</div>`;
    }
    if (params.get('msg')) {
        alertBox.innerHTML = `<div class="alert alert-success">✅ ${decodeURIComponent(params.get('msg'))}</div>`;
    }

    // Client-side password match check before form submits
    function validateForm() {
        const p1 = document.getElementById('newPassword').value;
        const p2 = document.getElementById('confirmPassword').value;
        if (p1 !== p2) {
            alert('Passwords do not match. Please re-enter.');
            return false;
        }
        return true;
    }
</script>

</body>
</html>
